name: Weekly Experimental DDRI

on:
  workflow_run:
    workflows: ["Weekly Data Refresh"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Latest consensus release to process (data-latest or data-YYYY-WNN)."
        required: true
        default: data-latest
        type: string
      publish:
        description: "Attach DDRI assets to the weekly and data-latest releases."
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: weekly-experimental-ddri
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish experimental DDRI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-reputation.txt

      - name: Resolve workflow parameters
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$INPUT_RELEASE_TAG"
            publish="$INPUT_PUBLISH"
            source_run_id="$GITHUB_RUN_ID"
            source_head_sha="$GITHUB_SHA"
          else
            release_tag="data-latest"
            publish="true"
            source_run_id="$SOURCE_RUN_ID"
            source_head_sha="$SOURCE_HEAD_SHA"
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "PUBLISH_DDRI=$publish" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=$source_run_id" >> "$GITHUB_ENV"
          echo "SOURCE_HEAD_SHA=$source_head_sha" >> "$GITHUB_ENV"

      - name: Download public consensus history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/download_release_history.py \
            --repo "$GITHUB_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --count 8 \
            --output-dir /tmp/ddri-release-history

      - name: Build experimental DDRI archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            scripts/build_reputation_release.py
            --release-root /tmp/ddri-release-history
            --output-dir data/archive
            --repo "$GITHUB_REPOSITORY"
            --github-run-id "$SOURCE_RUN_ID"
            --git-commit-sha "$SOURCE_HEAD_SHA"
          )
          if [ "$PUBLISH_DDRI" = "true" ]; then
            args+=(--publish)
          fi
          python "${args[@]}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: experimental-ddri-${{ github.run_id }}
          path: |
            data/archive/*/domain_reputation_experimental_*.csv.gz
            data/archive/*/meta_reputation_experimental_*.json
          retention-days: 14
          if-no-files-found: error
