version: 2

models:
  - name: mart_domain_consensus_score
    description: Domain consensus score mart combining implemented ranking sources.
    columns:
      - name: registered_domain
        description: Registered domain normalized to ASCII / punycode.
        data_tests:
          - unique
          - not_null
      - name: consensus_score
        description: Consensus score on a 0-100 scale. NULL when coverage is below the configured consensus threshold.
      - name: p_tranco
        description: Tranco percentile score, where higher is better.
      - name: p_majestic
        description: Majestic RefSubNets percentile score, where higher is better.
      - name: p_radar
        description: Cloudflare Radar bucket percentile score, where higher is better.
      - name: p_crux
        description: CrUX popularity bucket percentile score, where higher is better.
      - name: p_opr
        description: OpenPageRank percentile score, where higher is better.
      - name: majestic_ref_subnets
        description: Best Majestic RefSubNets value observed for the registered domain.
      - name: majestic_subdomains_seen
        description: Count of Majestic raw domain values collapsed into the registered domain.
      - name: radar_rank_bucket
        description: Smallest Cloudflare Radar ranking bucket containing the domain.
      - name: radar_buckets_seen
        description: Count of Cloudflare Radar buckets containing the registered domain.
      - name: crux_rank_bucket
        description: Smallest CrUX experimental popularity rank bucket observed for the registered domain.
      - name: crux_origins_seen
        description: Count of CrUX origins collapsed into the registered domain.
      - name: crux_snapshot_date
        description: CrUX monthly dataset snapshot date for rows with CrUX coverage.
      - name: openpagerank_decimal
        description: Best OpenPageRank decimal score observed for the registered domain.
      - name: openpagerank_integer
        description: Best OpenPageRank integer score observed for the registered domain.
      - name: openpagerank_rank
        description: Best OpenPageRank rank observed for the registered domain.
      - name: opr_subdomains_seen
        description: Count of OPR rows collapsed into the registered domain.
      - name: coverage_tier
        description: Coverage tier for implemented ranking sources. Sparse rows keep raw signals but do not receive a consensus score.
        data_tests:
          - not_null
          - accepted_values:
              values: ['full', 'high', 'partial', 'sparse']
      - name: sources_count
        description: Count of ranking sources present for the domain.
        data_tests:
          - not_null
      - name: security_flags_observed
        description: True only when enough independent risk sources have observed this registered domain.
        data_tests:
          - not_null
      - name: risk_sources_count
        description: Count of risk sources with observations under this registered domain.
        data_tests:
          - not_null
      - name: threat_types
        description: Distinct observed threat categories aggregated from risk sources.
        data_tests:
          - not_null
      - name: last_threat_seen
        description: Most recent risk-source observation date for this registered domain.
      - name: snapshot_date
        description: Source snapshot date.
        data_tests:
          - not_null
      - name: methodology_version
        description: Scoring methodology version.
        data_tests:
          - not_null
