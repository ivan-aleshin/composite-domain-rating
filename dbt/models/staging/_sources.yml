version: 2

# Sources are added incrementally as ingestion scripts are implemented.
# See ROADMAP.md for the public milestone sequence.

sources:
  - name: crux
    description: Chrome UX Report public BigQuery dataset.
    database: chrome-ux-report
    schema: experimental
    tables:
      - name: global
        description: Monthly global CrUX origin data with experimental popularity buckets.
        columns:
          - name: yyyymm
            description: CrUX dataset month in YYYYMM format.
          - name: origin
            description: Web origin included in the CrUX dataset.
          - name: experimental.popularity.rank
            description: Experimental CrUX popularity rank magnitude bucket.

  - name: raw
    description: Raw data loaded from external sources by ingestion scripts.
    database: "{{ target.project }}"
    schema: raw
    tables:
      - name: tranco_domains
        description: Tranco top 1M domains, normalized to registered domains.
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 8, period: day }
          error_after: { count: 14, period: day }
        columns:
          - name: registered_domain
            description: Registered domain normalized to ASCII / punycode.
            data_tests:
              - not_null
          - name: tranco_rank
            description: Best Tranco rank observed for the registered domain.
            data_tests:
              - not_null
          - name: snapshot_date
            description: Source snapshot date loaded by the ingestion script.
            data_tests:
              - not_null
          - name: ingested_at
            description: Timestamp when the raw table was created or refreshed.
            data_tests:
              - not_null
      - name: majestic_domains
        description: Majestic Million domains, normalized to registered domains.
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 8, period: day }
          error_after: { count: 14, period: day }
        columns:
          - name: registered_domain
            description: Registered domain normalized to ASCII / punycode.
            data_tests:
              - not_null
          - name: ref_subnets
            description: Best RefSubNets value observed for the registered domain.
            data_tests:
              - not_null
          - name: subdomains_seen
            description: Count of raw Majestic domain values collapsed into the registered domain.
            data_tests:
              - not_null
          - name: snapshot_date
            description: Source snapshot date loaded by the ingestion script.
            data_tests:
              - not_null
          - name: ingested_at
            description: Timestamp when the raw table was created or refreshed.
            data_tests:
              - not_null
      - name: cloudflare_domains
        description: Cloudflare Radar ranking bucket domains, normalized to registered domains.
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 8, period: day }
          error_after: { count: 14, period: day }
        columns:
          - name: registered_domain
            description: Registered domain normalized to ASCII / punycode.
            data_tests:
              - not_null
          - name: rank_bucket
            description: Smallest Cloudflare Radar ranking bucket containing the domain.
            data_tests:
              - not_null
          - name: buckets_seen
            description: Count of Cloudflare Radar buckets containing the registered domain.
            data_tests:
              - not_null
          - name: snapshot_date
            description: Source snapshot date loaded by the ingestion script.
            data_tests:
              - not_null
          - name: ingested_at
            description: Timestamp when the raw table was created or refreshed.
            data_tests:
              - not_null
      - name: opr_domains
        description: OpenPageRank top 10M rows, normalized to registered domains.
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 60, period: day }
          error_after: { count: 90, period: day }
        columns:
          - name: registered_domain
            description: Registered domain normalized to ASCII / punycode.
            data_tests:
              - not_null
          - name: openpagerank_decimal
            description: OpenPageRank decimal score.
          - name: openpagerank_integer
            description: OpenPageRank rounded integer score.
          - name: openpagerank_rank
            description: OpenPageRank row rank from the downloaded top 10M file.
          - name: snapshot_date
            description: Source snapshot date loaded by the ingestion script.
            data_tests:
              - not_null
          - name: ingested_at
            description: Timestamp when the raw table was created or refreshed.
            data_tests:
              - not_null
      - name: urlhaus_domains
        description: URLhaus recent malware URL observations, aggregated to registered domains and threat types.
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 8, period: day }
          error_after: { count: 15, period: day }
        columns:
          - name: registered_domain
            description: Registered domain derived from the observed URL host.
            data_tests:
              - not_null
          - name: threat_type
            description: Threat category reported by URLhaus.
            data_tests:
              - not_null
          - name: first_seen
            description: Earliest URLhaus observation date for this domain and threat type.
            data_tests:
              - not_null
          - name: last_seen
            description: Latest URLhaus observation date for this domain and threat type.
            data_tests:
              - not_null
          - name: threat_count
            description: Count of URL observations collapsed into this domain and threat type.
            data_tests:
              - not_null
          - name: observed_hosts_count
            description: Count of distinct URL hosts collapsed into this registered domain and threat type.
            data_tests:
              - not_null
          - name: snapshot_date
            description: Source snapshot date loaded by the ingestion script.
            data_tests:
              - not_null
          - name: ingested_at
            description: Timestamp when the raw table was created or refreshed.
            data_tests:
              - not_null
