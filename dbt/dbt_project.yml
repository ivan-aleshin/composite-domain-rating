name: 'composite_domain_rating'
version: '0.2.0'
config-version: 2

profile: 'composite_domain_rating'

# Path settings
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Project-wide variables
vars:
  # Methodology version — bump when scoring formula changes
  methodology_version: 'v0.3.0-beta'

  # Minimum number of ranking sources required to produce a consensus score
  # Domains with fewer sources are flagged as 'sparse' with NULL score
  min_sources_for_score: 3

  # CrUX snapshot month — override for backfill or fallback.
  # Default is derived conservatively from run_started_at:
  # previous month on/after day 14, otherwise two months back.
  # Format: 'YYYYMM' (e.g., '202604')
  # crux_yyyymm: '202604'

  # Snapshot date for current run — override for backfill
  # Default: current date at runtime
  # snapshot_date: '2026-05-04'

  # Cost guardrail — query will fail rather than scan more than this
  # Set to 20 GB to protect sandbox 1 TB/month limit
  maximum_bytes_billed: 21474836480  # 20 GiB

# Query comment — visible in BigQuery query history for debugging
query-comment:
  comment: "{{ query_comment(node) }}"
  append: true

models:
  composite_domain_rating:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      +on_schema_change: sync_all_columns
